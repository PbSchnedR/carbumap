name: Site GitHub Pages

# Le site est republié à chaque poussée sur main : pas d'attente, pas de validation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les poussées suivantes remplacent celle en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Un site cassé ne doit jamais être publié.
      - run: npm run typecheck
      - run: npm test

      # GitHub Pages sert le dépôt depuis /<nom-du-depot>/ : sans ce préfixe, tous les
      # fichiers seraient cherchés à la racine du domaine et la page resterait blanche.
      - name: Construire le site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
